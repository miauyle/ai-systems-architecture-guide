title: AI Systems Notes
tagline: 模型、训练、推理、应用与可靠性的系统知识库
description: 用中文解释 AI 系统的技术机制、数据流、组件关系与工程代价。

url: "https://miauyle.github.io"
baseurl: "/ai-systems-notes"
lang: zh-CN
timezone: Asia/Shanghai

theme: jekyll-theme-docsteer

docsteer:
  skin: aqua
  mode: auto
  skin_switcher: true
  mode_switcher: true
  doc_layouts: [doc]

  sidebar:
    enabled: true
    collapse_inactive: true
    sticky: true

  toc:
    enabled: true
    min_headings: 2

  search:
    enabled: true
    collections: [docs]
    include_pages: true
    hotkey: true
    placeholder: "搜索文档…"
    max_results: 8
    index_questions: false

  lightbox:
    enabled: true

  code:
    copy_button: true
    line_numbers: false

  fontawesome:
    enabled: true
    source: local
    cdn_url: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    cdn_integrity: ""

  logo: /assets/images/logo-theme.svg
  favicon: /assets/images/favicon-systems.svg

  footer:
    show_credit: false
    copyright: "AI Systems Notes"
    links:
      - { label: "首页", url: "/" }
      - { label: "GitHub", url: "https://github.com/miauyle/ai-systems-notes" }

  social:
    github: "miauyle/ai-systems-notes"
    rss: true

  edit_page:
    enabled: true
    repo: "https://github.com/miauyle/ai-systems-notes"
    branch: "master"
    # Documents are generated in memory from their original docs/ paths.
    path: ""

collections:
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope: { path: "", type: "docs" }
    values:
      layout: doc
      seo:
        type: TechArticle
  - scope: { path: "" }
    values:
      layout: page

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: plaintext

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - docs
  - maintenance
  - templates
  - tools
  - navigation.json
  - AGENTS.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - package.json
  - package-lock.json
  - site-qa
